[package]
name = "marky"
version = "0.1.0"
description = "Marky - A Markdown Editor"
authors = ["Tarik Kavaz"]
license = "MIT"
repository = "https://github.com/tarikkavaz/marky"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "~2"
tauri-plugin-fs = "~2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2.0.0"
notify = "6.1"
url = "2.5"
